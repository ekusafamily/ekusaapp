# EKUSA Digital Platform - Docker Compose for Local Development
# Run with: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ekusa-postgres
    environment:
      POSTGRES_USER: ekusa
      POSTGRES_PASSWORD: ekusa_dev_password
      POSTGRES_DB: ekusa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekusa -d ekusa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, sessions, rate limiting
  redis:
    image: redis:7-alpine
    container_name: ekusa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible object storage (profile pictures, etc.)
  minio:
    image: minio/minio:latest
    container_name: ekusa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekusa
      MINIO_ROOT_PASSWORD: ekusa_dev_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # API Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: ekusa-api
    environment:
      DATABASE_URL: postgresql://ekusa:ekusa_dev_password@postgres:5432/ekusa?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_ACCESS_EXPIRY: 15m
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:8081
      ADMIN_URL: http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ekusa
      S3_ACCESS_KEY: ekusa
      S3_SECRET_KEY: ekusa_dev_password
      FCM_SERVER_KEY: your-fcm-server-key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev

  # Admin Dashboard
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.dev
    container_name: ekusa-admin
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: ekusa-network